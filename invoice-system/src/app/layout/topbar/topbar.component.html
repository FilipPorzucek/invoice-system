<p-toolbar styleClass="custom-topbar">
    <div class="p-toolbar-group-start topbar-section">
      <span class="logo-text">SOF</span>
      <i class="pi pi-box logo-icon"></i>
        
      <p-button 
          icon="pi pi-home" 
          label="Panel główny" 
          severity="success" 
          size="small" 
          [rounded]="true" 
          [routerLink]="getUser()?.role === 'ACCOUNTANT' ? '/accountant/dashboard' : '/employee/dashboard'">
      </p-button>
       <p-button 
          *ngIf="getUser()?.role === 'EMPLOYEE'" 
          icon="pi pi-plus" 
          label="Wgraj fakturę" 
          severity="info" 
          size="small" 
          [rounded]="true" 
          routerLink="/employee/invoice-upload">
      </p-button>
          <p-button icon="pi pi-file-excel" label="Wygeneruj raport" severity="info" size="small" [rounded]="true"></p-button>
    </div>

    <div class="p-toolbar-group-end topbar-section">
      <span class="user-name">{{ getUserDisplayName() }}</span>
        <p-avatar 
            icon="pi pi-user" 
            shape="circle" 
            styleClass="user-avatar"
            (click)="openDialog()">
        </p-avatar>
    </div>
</p-toolbar>

<!-- Zmodyfikowany Panel Użytkownika -->
<p-dialog 
  [(visible)]="dialogVisible" 
  [modal]="true" 
  [dismissableMask]="true" 
  header="Mój Profil"
  [style]="{ width: '400px' }"
  styleClass="profile-dialog">
  
  <ng-container *ngIf="isLoggedIn()">
    <div class="profile-content">
      
      <!-- Górna część z dużą ikoną i rolą -->
      <div class="profile-header">
          <div class="profile-avatar-large">
              <i class="pi pi-user"></i>
          </div>
          <h3 class="profile-name">{{ getUser()?.name || 'Użytkownik' }}</h3>
          <p class="profile-role">{{ getUser()?.role }}</p>
      </div>

      <!-- Środkowa część z danymi -->
      <div class="profile-details">
          <div class="detail-row">
              <span class="detail-label">Email</span>
              <span class="detail-value">{{ getUser()?.email }}</span>
          </div>
          <div class="detail-row">
              <span class="detail-label">Hasło</span>
              <span class="detail-value">••••••••</span>
          </div>
          <div class="detail-row" *ngIf="getUser()?.dateOfBirth">
              <span class="detail-label">Data urodzenia</span>
              <span class="detail-value">{{ getUser()?.dateOfBirth }}</span>
          </div>
      </div>

      <!-- Dolna część z szarym przyciskiem -->
      <div class="profile-actions">
          <button type="button" class="btn-logout" (click)="logout()">
              <i class="pi pi-sign-out"></i>
              Wyloguj się
          </button>
      </div>
    </div>
  </ng-container>
</p-dialog>
