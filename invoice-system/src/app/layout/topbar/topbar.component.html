<p-toolbar styleClass="custom-topbar">
    <div class="p-toolbar-group-start topbar-section">
      <span class="logo-text">SOF</span>
      <i class="pi pi-box logo-icon"></i>
        
<p-button icon="pi pi-home" label="Panel główny" severity="success" size="small" [rounded]="true"
    [routerLink]="getDashboardRoute()">
</p-button>
       <p-button 
          *ngIf="getUser()?.role === 'EMPLOYEE'" 
          icon="pi pi-plus" 
          label="Wgraj fakturę" 
          severity="info" 
          size="small" 
          [rounded]="true" 
          routerLink="/employee/invoice-upload">
      </p-button>
          <p-button *ngIf="getUser()?.role !== 'ADMIN'"  icon="pi pi-file-excel" label="Wygeneruj raport" severity="info" size="small" [rounded]="true"></p-button>
           <p-button *ngIf="getUser()?.role === 'ADMIN'"   icon="pi pi-cog" label="Ustawienia OCR" severity="info" size="small" [rounded]="true"></p-button>
            <p-button *ngIf="getUser()?.role === 'ADMIN'"   icon="pi pi-user-plus" label="Dodaj użytkownika" severity="info" size="small" [rounded]="true" (onClick)="goToCreateUser()"></p-button>
    </div>


    <div class="p-toolbar-group-end topbar-section">
      <span class="user-name">{{ getUserDisplayName() }}</span>
        <p-avatar 
            icon="pi pi-user" 
            shape="circle" 
            styleClass="user-avatar"
            (click)="openDialog()">
        </p-avatar>
    </div>
</p-toolbar>

<p-dialog 
  [(visible)]="dialogVisible" 
  [modal]="true" 
  [dismissableMask]="true" 
  header="Mój Profil"
  [style]="{ width: '400px' }"
  styleClass="profile-dialog">
  
  <ng-container *ngIf="isLoggedIn()">
    <div class="profile-content">
      
      <div class="profile-header">
          <div class="profile-avatar-large">
              <i class="pi pi-user"></i>
          </div>
          <h3 class="profile-name">{{ getUser()?.name || 'Użytkownik' }}</h3>
          <p class="profile-role">{{ getUser()?.role }}</p>
      </div>

      <div class="profile-details">
          <div class="detail-row">
              <span class="detail-label">Email</span>
              <span class="detail-value">{{ getUser()?.email }}</span>
          </div>
          <div class="detail-row">
              <span class="detail-label">Hasło</span>
              <span class="detail-value">••••••••</span>
          </div>
          <div class="detail-row" *ngIf="getUser()?.dateOfBirth">
              <span class="detail-label">Data urodzenia</span>
              <span class="detail-value">{{ getUser()?.dateOfBirth }}</span>
          </div>
      </div>

      <div class="profile-actions">
          <button type="button" class="btn-logout" (click)="logout()">
              <i class="pi pi-sign-out"></i>
              Wyloguj się
          </button>
      </div>
    </div>
  </ng-container>
</p-dialog>
