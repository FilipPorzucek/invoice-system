<div class="split-screen-container">
    
    <div class="left-panel">
        <p-card>
            <ng-template pTemplate="header">
                <div class="invoice-view-header">
                    <h2 class="invoice-view-title">{{ 'accountantInvoiceView.weryfikacjaDokumentu' | translate }}</h2>
                    <p-button icon="pi pi-arrow-left" [label]="'common.wroc' | translate" styleClass="p-button-text p-button-secondary" (onClick)="goBack()"></p-button>
                </div>
            </ng-template>

            <form [formGroup]="invoiceForm" class="invoice-form">
                
                <div class="form-row">
                    <div class="form-field">
                        <label>{{ 'common.numerFaktury' | translate }}</label>
                        <input pInputText formControlName="invoiceNumber" />
                    </div>
                    <div class="form-field">
                        <label>{{ 'common.dataWyst' | translate }}</label>
                        <p-calendar formControlName="issueDate" dateFormat="yy-mm-dd" dataType="string" [showIcon]="true"></p-calendar>
                    </div>
                    <div class="form-field" style="flex: 0.5;">
                        <label>{{ 'common.waluta' | translate }}</label>
                        <input pInputText formControlName="currency" />
                    </div>
                </div>

                <p-divider align="center"><b>{{ 'common.dostawca' | translate }}</b></p-divider>

                <div formGroupName="supplier" class="invoice-form">
                    <div class="form-field">
                        <label>{{ 'common.nazwaFirmy' | translate }}</label>
                        <input pInputText formControlName="name" />
                    </div>
                    <div class="form-row">
                        <div class="form-field">
                            <label>{{ 'common.nip' | translate }}</label>
                            <input pInputText formControlName="nip" />
                        </div>
                        <div class="form-field" style="flex: 2;">
                            <label>{{ 'common.numerKontaIban' | translate }}</label>
                            <input pInputText formControlName="bankAccountNumber" />
                        </div>
                    </div>
                    <div class="form-field">
                        <label>{{ 'common.adres' | translate }}</label>
                        <input pInputText formControlName="address" />
                    </div>
                </div>

              <p-divider align="center"><b>{{ 'common.pozycjeNaFakturze' | translate }}</b></p-divider>

<div formArrayName="items" class="items-container">
    <div *ngFor="let item of items.controls; let i=index" [formGroupName]="i" class="item-row">
        
        <div class="form-field col-name">
            <label *ngIf="i===0">{{ 'common.uslugaTowar' | translate }}</label>
            <input pInputText formControlName="name" />
        </div>

        <div class="form-field col-qty">
            <label *ngIf="i===0">{{ 'common.ilosc' | translate }}</label>
            <input pInputText formControlName="quantity" type="number" step="any" />
        </div>

        <div class="form-field col-price">
            <label *ngIf="i===0">{{ 'common.cenaNetto' | translate }}</label>
            <input pInputText formControlName="netPrice" type="number" step="0.01" />
        </div>

        <div class="form-field col-total">
            <label *ngIf="i===0">{{ 'common.wartoscNetto' | translate }}</label>
            <input pInputText formControlName="netValue" type="number" step="0.01" />
        </div>

        <div class="form-field col-tax">
            <label *ngIf="i===0">{{ 'common.vat' | translate }}</label>
            <input pInputText formControlName="taxRate" type="number" step="0.01" />
        </div>

    </div>
</div>

                <p-divider></p-divider>

                <div class="form-row mt-2">
                    <div class="form-field">
                        <label>{{ 'common.razemNetto' | translate }}</label>
                        <input pInputText formControlName="netAmount" type="number" step="0.01" />
                    </div>
                    <div class="form-field">
                        <label>{{ 'common.razemBrutto' | translate }}</label>
                        <input pInputText formControlName="grossAmount" type="number" step="0.01" />
                    </div>
                </div>

                <div class="invoice-actions">
                    <p-button 
                        [label]="'common.odrzuc' | translate" 
                        icon="pi pi-times" 
                        severity="danger" 
                        [outlined]="true"
                        (onClick)="openRejectDialog()">
                    </p-button>
                    <p-button 
                        [label]="'accountantInvoiceView.zatwierdzIPrzeslijDalej' | translate" 
                        icon="pi pi-check" 
                        severity="success" 
                        [disabled]="invoiceForm.invalid"
                        [loading]="isSubmitting"
                        (onClick)="onApprove()">
                    </p-button>
                </div>
            </form>
        </p-card>
    </div>

    <div class="right-panel">
        <p-card styleClass="h-full preview-card">
            <div *ngIf="pdfPreviewUrl" class="pdf-viewer-area">
                <pdf-viewer 
                    [src]="pdfPreviewUrl" 
                    [render-text]="true"
                    [original-size]="false" 
                    [fit-to-page]="true"
                    style="display: block; width: 100%;">
                </pdf-viewer>
            </div>
            <div *ngIf="!pdfPreviewUrl" class="flex align-items-center justify-content-center h-full text-500">
                {{ 'common.ladowaniePodgladuDokumentu' | translate }}
            </div>
        </p-card>
    </div>
</div>

<p-dialog
    [header]="'common.odrzucenieDokumentu' | translate"
    [(visible)]="showRejectDialog"
    [modal]="true"
    [draggable]="false"
    [resizable]="false"
    [style]="{ width: '560px' }"
    [breakpoints]="{ '640px': '92vw' }"
    styleClass="reject-dialog">
    <div class="reject-dialog-content">
        <label for="reason" class="reject-dialog-label">{{ 'common.podajPowodOdrzuceniaWymagany' | translate }}</label>
        <textarea
            id="reason"
            pInputTextarea
            [(ngModel)]="rejectReason"
            rows="6"
            class="reject-dialog-textarea"
            [placeholder]="'accountantInvoiceView.npNiezgodnoscKwotBrakujacyNip' | translate"></textarea>
    </div>
    <div class="reject-dialog-actions">
        <p-button [label]="'common.anuluj' | translate" severity="secondary" [text]="true" (onClick)="showRejectDialog = false"></p-button>
        <p-button [label]="'common.potwierdzOdrzucenie' | translate" icon="pi pi-times" severity="danger" [disabled]="!rejectReason.trim()" (onClick)="onReject()"></p-button>
    </div>
</p-dialog>
