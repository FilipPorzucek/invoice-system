version: "3.8"

services:
 db:
  image: postgres:17-alpine
  container_name: invoice_db
  environment:
   POSTGRES_DB: invoice-system
   POSTGRES_USER: postgres
   POSTGRES_PASSWORD: 1234
  ports:
   - "5432:5432"
  volumes:
   - pgdata:/var/lib/postgresql/data
  healthcheck:
   test: ["CMD-SHELL", "pg_isready -U postgres"]
   interval: 5s
   timeout: 3s
   retries: 10
  networks:
   - invoice_network

 db-seed:
  image: postgres:17-alpine
  container_name: invoice_db_seed
  profiles:
   - demo
  depends_on:
   backend:
    condition: service_healthy
  environment:
   - PGPASSWORD=1234
  volumes:
   - ./demo-seed.sql:/seed.sql:ro
  entrypoint: ["psql", "-h", "db", "-U", "postgres", "-d", "invoice-system", "-f", "/seed.sql"]
  networks:
   - invoice_network

 backend:
  build: ./api/api
  container_name: invoice_backend
  ports:
   - "8081:8081"
  environment:
   - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/invoice-system
   - SPRING_DATASOURCE_USERNAME=postgres
   - SPRING_DATASOURCE_PASSWORD=1234
   - MINIO_URL=http://host.docker.internal:9000
   - OCR_API_URL=http://host.docker.internal:8000
   - WEBHOOK_BASE_URL=http://host.docker.internal:8081
  extra_hosts:
   - "host.docker.internal:host-gateway"
  depends_on:
   - db
  networks:
   - invoice_network

 frontend:
  build: ./invoice-system
  container_name: invoice_frontend
  ports:
   - "4200:80"
  depends_on:
   - backend
  networks:
   - invoice_network

volumes:
 pgdata:

networks:
 invoice_network:
  driver: bridge
